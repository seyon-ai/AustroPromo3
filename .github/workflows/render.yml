name: Render Film
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "AustroClashFilm"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render landscape
        run: npx remotion render ${{ github.event.inputs.composition || 'AustroClashFilm' }} out/AustroClashFilm.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Render vertical
        run: npx remotion render AustroClashFilmVertical out/AustroClashFilmVertical.mp4 --codec=h264 --crf=18 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: austroclash-film
          path: out/*.mp4
          retention-days: 14
